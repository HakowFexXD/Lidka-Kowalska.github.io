<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MOJE POSTACIE / MY CHARACTERS — Hakow Fex</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* OGÓLNE */
  :root {
    --neon: #00ff00;
  }
  body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: 'Press Start 2P', monospace;
    overflow-x: hidden;
  }

  /* TŁO (jak na 1 stronie) */
  #background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
  }
  .square {
    position: absolute;
    background: var(--neon);
    opacity: 0.28;
    width: 6px;
    height: 6px;
    animation: float 10s infinite alternate ease-in-out;
    filter: drop-shadow(0 0 6px var(--neon));
  }
  @keyframes float {
    from { transform: translate(0, 0); }
    to { transform: translate(50px, -50px); }
  }

  /* KONTAINER */
  .container {
    position: relative;
    z-index: 1000 !important;
    text-align: center;
    padding: 40px 20px;
  }

  /* NEON TITLE */
  .neon-title {
    font-size: 22px;
    color: var(--neon);
    text-shadow:
      0 0 4px var(--neon),
      0 0 8px var(--neon);
    margin: 0 0 6px 0;
  }

  h2.subtitle {
    font-size: 12px;
    color: var(--neon);
    margin-top: 6px;
    margin-bottom: 24px;
  }

  /* SEKCJE */
  .sections {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .section-btn {
    border: 3px solid var(--neon);
    padding: 18px;
    border-radius: 14px;
    font-size: 12px;
    width: 220px;
    cursor: pointer;
    transition: 0.25s;
    background: rgba(0,0,0,0.45);
    position: relative;
    z-index: 1100 !important;
  }
  .section-btn:hover {
    box-shadow: 0 0 18px var(--neon);
    transform: translateY(-3px);
  }

  /* GALERIA */
  .gallery {
    margin: 30px auto 10px auto;
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    justify-items: center;
    max-width: 1100px;
    z-index: 1050;
  }

  .gallery.show {
    display: grid;
  }

  .gallery-item {
    width: 180px;
    height: 180px;
    border: 3px solid var(--neon);
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .gallery-item img, .gallery-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gallery-item:hover {
    transform: scale(1.03);
    box-shadow: 0 0 12px var(--neon);
  }

  /* BACK */
  .back-btn {
    margin-top: 28px;
    background: var(--neon);
    color: black;
    padding: 18px 26px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 15px var(--neon);
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 1px;
    z-index: 1200;
  }
  .back-btn:hover {
    background: white;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 5000;
  }

  .lightbox-content {
    max-width: 90%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  #lightboxImage,
  #lightboxVideo {
    max-width: 80vw;
    max-height: 75vh;
    object-fit: contain;
  }

  .close-btn {
    border: none;
    background: transparent;
    color: var(--neon);
    font-size: 22px;
    cursor: pointer;
    text-shadow: 0 0 8px var(--neon);
    margin-bottom: 10px;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    padding: 10px;
    cursor: pointer;
    text-shadow: 0 0 8px var(--neon);
  }

  .nav-left { left: -60px; }
  .nav-right { right: -60px; }

  @media (max-width: 700px) {
    .section-btn { width: 100%; max-width: 380px; }
    .gallery-item { width: 140px; height: 140px; }
  }
</style>
</head>
<body>

<!-- TŁO -->
<div id="background"></div>

<div class="container">
  <h1 class="neon-title">DLA CIEKAWSKICH / FOR CURIOUS PEOPLE</h1>
  <h2 class="subtitle">MOJE POSTACIE / MY CHARACTERS</h2>

  <!-- WYBÓR SEKCJI -->
  <div class="sections">
    <div class="section-btn" data-type="doodles">DOODLES / BAZGROŁY</div>
    <div class="section-btn" data-type="main">MAIN / GŁÓWNE</div>
    <div class="section-btn" data-type="random">RANDOM / RANDOMOWE</div>
  </div>

  <!-- GALERIE -->
  <div id="gallery-doodles" class="gallery"></div>
  <div id="gallery-main" class="gallery"></div>
  <div id="gallery-random" class="gallery"></div>

  <button class="back-btn" onclick="window.location.href='index.html'">WRÓĆ / BACK</button>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <button id="closeLightbox" class="close-btn">ZAMKNIJ ✖</button>

  <div class="lightbox-content">
    <button class="close-btn lightbox-nav nav-left" id="prevBtn">◀</button>
    <img id="lightboxImage" src="" alt="" style="display:none;">
    <video id="lightboxVideo" controls style="display:none;"></video>
    <button class="close-btn lightbox-nav nav-right" id="nextBtn">▶</button>
    <p id="imageName"></p>
  </div>
</div>

<script>
/* TŁO */
(function makeBackgroundSquares(){
  const bg = document.getElementById('background');
  for (let i = 0; i < 40; i++) {
    const sq = document.createElement('div');
    sq.className = 'square';
    sq.style.top = Math.random() * 100 + '%';
    sq.style.left = Math.random() * 100 + '%';
    sq.style.animationDuration = 5 + Math.random() * 10 + 's';
    const size = 2 + Math.random() * 6;
    sq.style.width = sq.style.height = size + 'px';
    bg.appendChild(sq);
  }
})();

/* DANE */
const characters = {
  doodles: [
    { file: "works/doodle1.png", name: " " },
    { file: "works/doodle2.png", name: " " },
    { file: "works/doodle3.png", name: " " },
    { file: "works/doodle4.png", name: " " },
    { file: "works/doodle5.png", name: " " },
    { file: "works/doodle6.png", name: " " },
    { file: "works/image0.png", name: " " },
    { file: "works/image0.png", name: " " },
    { file: "works/image1.png", name: " " },
    { file: "works/image3.png", name: " " },
    { file: "works/image4.png", name: " " },
    { file: "works/image5.png", name: " " }
  ],
  main: [
    { file: "works/zen.png", name: "Zen Itu" },
    { file: "works/grivetherf.png", name: "Grivet Herf / Xofer" },
    { file: "works/thedoctor.png", name: "The Doctor / Soter" },
    { file: "works/jakeanddave.png", name: "Jake & Dave" }
  ],
  random: [
    { file: "works/random.png", name: " " },
    { file: "works/random2.png", name: " " },
    { file: "works/random3.png", name: " " },
    { file: "works/random4.png", name: " " },
    { file: "works/random5.png", name: " " },
    { file: "works/random6.png", name: " " },
    { file: "works/random7.png", name: " " },
    { file: "works/random8.png", name: " " },
    { file: "works/random11.png", name: " " },
    { file: "works/random10.png", name: " " },
    { file: "works/random9.png", name: " " }
  ]
};

/* DOM */
const sectionBtns = document.querySelectorAll('.section-btn');
const galleryDoodles = document.getElementById('gallery-doodles');
const galleryMain = document.getElementById('gallery-main');
const galleryRandom = document.getElementById('gallery-random');

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const lightboxVideo = document.getElementById('lightboxVideo');
const imageName = document.getElementById('imageName');
const closeLightbox = document.getElementById('closeLightbox');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentGallery = [];
let currentIndex = 0;

/* TWORZENIE MINIATUREK */
function populateGallery(containerEl, items) {
  containerEl.innerHTML = '';
  items.forEach((it, idx) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.setAttribute('data-idx', idx);

    if (it.file.endsWith('.mp4') || it.file.endsWith('.mov') || it.file.endsWith('.webm')) {
      const vid = document.createElement('video');
      vid.src = it.file;
      vid.muted = true;
      vid.loop = true;
      vid.autoplay = true;
      vid.playsInline = true;
      div.appendChild(vid);
    } else {
      const img = document.createElement('img');
      img.src = it.file;
      img.alt = it.name || '';
      div.appendChild(img);
    }

    div.addEventListener('click', () => openLightbox(items, idx));
    containerEl.appendChild(div);
  });
}

/* WYSWIETLANIE DANEJ GALERII */
sectionBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    [galleryDoodles, galleryMain, galleryRandom].forEach(g => g.classList.remove('show'));

    const type = btn.dataset.type;
    let container = galleryDoodles;
    if (type === 'main') container = galleryMain;
    if (type === 'random') container = galleryRandom;

    if (container.children.length === 0) {
      populateGallery(container, characters[type]);
    }

    container.classList.add('show');
    container.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
});

/* LIGHTBOX */
function openLightbox(galleryArray, startIndex = 0) {
  currentGallery = galleryArray;
  currentIndex = startIndex;

  const item = currentGallery[currentIndex];
  if (!item) return;

  imageName.textContent = item.name || '';

  if (item.file.endsWith('.mp4') || item.file.endsWith('.mov') || item.file.endsWith('.webm')) {
    lightboxImage.style.display = 'none';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = item.file;
    lightboxVideo.currentTime = 0;
    lightboxVideo.play().catch(()=>{});
  } else {
    lightboxVideo.pause();
    lightboxVideo.style.display = 'none';
    lightboxImage.style.display = 'block';
    lightboxImage.src = item.file;
  }

  lightbox.style.display = 'flex';
  lightbox.setAttribute('aria-hidden', 'false');
}

/* STRZAŁKI */
function showPrevNext(dir) {
  currentIndex += dir;
  if (currentIndex < 0) currentIndex = currentGallery.length - 1;
  if (currentIndex >= currentGallery.length) currentIndex = 0;

  const item = currentGallery[currentIndex];
  imageName.textContent = item.name || '';

  if (item.file.endsWith('.mp4') || item.file.endsWith('.mov') || item.file.endsWith('.webm')) {
    lightboxImage.style.display = 'none';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = item.file;
    lightboxVideo.currentTime = 0;
    lightboxVideo.play().catch(()=>{});
  } else {
    lightboxVideo.pause();
    lightboxVideo.style.display = 'none';
    lightboxImage.style.display = 'block';
    lightboxImage.src = item.file;
  }
}

prevBtn.addEventListener('click', () => showPrevNext(-1));
nextBtn.addEventListener('click', () => showPrevNext(1));

/* ZAMYKANIE */
function closeLB() {
  lightbox.style.display = 'none';
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxVideo.pause();
  lightboxVideo.src = '';
  lightboxImage.src = '';
}

closeLightbox.addEventListener('click', closeLB);

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLB();
});

/* KLAWISZE */
document.addEventListener('keydown', (e) => {
  if (lightbox.style.display === 'flex') {
    if (e.key === 'ArrowRight') showPrevNext(1);
    if (e.key === 'ArrowLeft') showPrevNext(-1);
    if (e.key === 'Escape') closeLB();
  }
});
</script>

</body>
</html>
